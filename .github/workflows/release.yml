name: Release Plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  release-frozen:
    if: vars.RELEASES_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Stop while releases are frozen
        run: |
          echo "::error::Releases are frozen. Do not create version tags until release verification is complete."
          exit 1

  build:
    if: vars.RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build approved dependency
        run: pnpm rebuild esbuild

      - name: Run Tests
        run: pnpm test

      - name: Build Plugin
        run: pnpm run build

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'main.js, manifest.json, styles.css'

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            main.js
            manifest.json
            styles.css
          draft: false
          prerelease: false
          generate_release_notes: true
